name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: lint + typecheck + build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        env:
          # Build does not need real values; supply placeholders so any
          # build-time reads do not throw. Actual values are set in Vercel.
          RESEND_API_KEY: ci-placeholder
          EMAIL_FROM: noreply@example.com
          EMAIL_TO: noreply@example.com
        run: npm run build
